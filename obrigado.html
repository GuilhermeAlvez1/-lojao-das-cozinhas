<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; media-src 'self'; font-src 'self'; connect-src 'self'; form-action 'self'; base-uri 'self'; object-src 'none'; frame-src 'none'; upgrade-insecure-requests">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Obrigado pela sua solicitação | Lojão das Cozinhas</title>
  <meta name="description" content="Seu formulário foi enviado com sucesso. Nossa equipe analisará em breve.">
  <link rel="canonical" href="https://lojaodascozinhas.com.br/obrigado.html">
  <meta name="robots" content="noindex">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="stylesheet" href="assets/style.css">
  <style>
    body { background: linear-gradient(135deg, #1D3655 0%, #2a4a6f 100%); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem; }
    .thank-you-container { max-width: 500px; width: 100%; text-align: center; color: white; }
    .thank-you-icon { font-size: 80px; margin-bottom: 1.5rem; animation: bounce 0.6s ease; display: block; }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
    h1 { font-size: 2rem; margin: 0 0 1rem 0; font-weight: 700; color: white; }
    p { font-size: 1rem; line-height: 1.6; margin: 1rem 0; color: rgba(255, 255, 255, 0.9); }
    strong { color: #EC5E36; }
    .btn-voltar { display: inline-block; margin-top: 2rem; padding: 0.75rem 1.5rem; background-color: #EC5E36; color: white; text-decoration: none; border-radius: 8px; font-weight: 600; transition: all 0.3s ease; }
    .btn-voltar:hover { background-color: #d94d27; transform: translateY(-2px); box-shadow: 0 8px 24px rgba(236, 94, 54, 0.3); }
    @media (max-width: 600px) { h1 { font-size: 1.5rem; } .thank-you-icon { font-size: 60px; } }
  </style>
</head>
<body>
  <div class="thank-you-container">
    <span class="thank-you-icon">✅</span>
    <h1>Obrigado pela sua solicitação!</h1>
    <p>Recebemos seus dados e o arquivo com sucesso.</p>
    <p>Nossa equipe analisará sua necessidade e <strong>entrará em contato em breve</strong> via email ou WhatsApp.</p>
    <p><strong>Tempo de resposta:</strong> até 24 horas úteis (dias úteis)</p>
    <a href="/" class="btn-voltar">← Voltar para a home</a>
  </div>
</body>
</html>
